# Local development. Production uses docker-compose.prod.yml, which CI ships to
# the VM with the image digest pinned.
name: arteamis-dev

services:
  backend:
    build:
      context: .
      target: runtime
    image: arteamis-backend:dev
    container_name: arteamis-backend-dev
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://arteamis:${POSTGRES_PASSWORD:-arteamis}@postgres:5432/arteamis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arteamis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arteamis}
      POSTGRES_DB: ${POSTGRES_DB:-arteamis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arteamis}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
